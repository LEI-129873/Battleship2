# 129873 - Martim Barros
name: empty
inspections:
  - inspection: MethodCount
    enabled: true
    options:
      m_limit: 15
      ignoreGettersAndSetters: false
      ignoreOverridingMethods: false

  - inspection: ClassComplexity
    enabled: true
    options:
      m_limit: 47

  - inspection: FieldCount
    enabled: true
    options:
      m_limit: 14
      m_countConstantFields: false
      m_considerStaticFinalFieldsConstant: true