# 129825 - Pedro Coelho
# Perfil externo: as propriedades ficam diretamente na raiz do ficheiro.
name: empty
inspections:
  # NCSS conta instruções, não linhas físicas de código (LOC).
  - inspection: NonCommentSourceStatements
    enabled: true
    severity: WARNING
    options:
      m_limit: 20
  - inspection: CyclomaticComplexity
    enabled: true
    severity: WARNING
    options:
      m_limit: 10
