# Ajuda do Menu
help.title======================== AJUDA DO MENU =========================
help.subtitle=Digite um dos comandos abaixo para interagir com o jogo:
help.gerafrota=- gerafrota / genfleet: Gera uma frota aleatória de navios.
help.lefrota=- lefrota / loadfleet: Permite criar e carregar uma frota personalizada.
help.status=- estado / status: Mostra o estado atual da frota.
help.mapa=- mapa / map: Exibe o mapa da frota.
help.rajada=- rajada / fire: Realiza uma rajada de disparos.
help.simula=- simula / simulate: Simula um jogo completo.
help.tiros=- tiros / shots: Lista os tiros realizados (* = tiro em navio, o = tiro na água).
help.lang=- idioma / lang <pt|en>: Alterna o idioma do jogo entre Português e Inglês.
help.pdf=- PDF: Exporta o histórico do jogo para PDF.
help.desistir=- desisto / quit: Encerra o jogo.
help.footer===============================================================

