# Menu Help
help.title======================== MENU HELP =========================
help.subtitle=Type one of the commands below to interact with the game:
help.gerafrota=- genfleet / gerafrota: Generates a random fleet of ships.
help.lefrota=- loadfleet / lefrota: Allows creating and loading a custom fleet.
help.status=- status / estado: Shows current fleet status.
help.mapa=- map / mapa: Displays the fleet map.
help.rajada=- fire / rajada: Fires a burst of shots.
help.simula=- simulate / simula: Simulates a full game.
help.tiros=- shots / tiros: Lists shots fired (* = hit on ship, o = missed shot).
help.tabuleiros=- boards / tabuleiros: Shows both boards in a graphical window.
help.lang=- lang / idioma <pt|en>: Switch game language between Portuguese and English.
help.pdf=- PDF: Export games history to PDF.
help.desistir=- quit / desisto: Ends the game.
help.footer============================================================

