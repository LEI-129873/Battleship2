# 129825 - Pedro Coelho
name: Checkstyle - Classes e interfaces (129825)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: checkstyle-types-129825-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkstyle-types-129825:
    name: Checkstyle TypeName 129825
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar nomes de classes e interfaces
        uses: dbelyaev/action-checkstyle@v4.5.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129825.xml
          checkstyle_version: '14.4.0'
          workdir: src
          reporter: github-check
          level: error
          filter_mode: nofilter
          fail_level: error
          reviewdog_flags: -name=checkstyle-types-129825
