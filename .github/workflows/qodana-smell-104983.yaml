# 104983 - Gonçalo Sena Esteves
name: Qodana smell gate 104983

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana-104983:
    name: Shotgun Surgery gate 104983
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: --config qodana-104983.yaml
          # Análise completa: as dependências de uma classe vêm de outros ficheiros.
          pr-mode: false
          use-annotations: true
          post-pr-comment: true
