# 129873 - Martim Barros
name: Qodana smell gate 129873

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Qodana Action
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-12345.yaml
          use-annotations: true
          post-pr-comment: true