name: Checkstyle - Method Name (129873)

on:
  pull_request:
    branches:
      - main

jobs:
  checkstyle-method:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkstyle Analysis
        uses: nikitasavinov/checkstyle-action@1.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: 'checkstyle-129873.xml'
          fail_level: 'any'