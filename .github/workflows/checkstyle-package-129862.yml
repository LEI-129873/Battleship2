# 129862 - Joao Almeida
name: Checkstyle - Package Name (129862)

on:
  pull_request:
    branches:
      - main

jobs:
  checkstyle-package-129862:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkstyle Analysis
        uses: nikitasavinov/checkstyle-action@1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: 'checkstyle-129862.xml'
          fail_level: 'any'