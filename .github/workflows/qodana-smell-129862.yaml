# 129862 - Joao Almeida
name: Qodana smell gate 129862
on:
  push:
    branches: [main, add-qodana-129862]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  qodana-129862:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129862.yaml --property project.open.type=Maven
          pr-mode: false
          use-annotations: true
          post-pr-comment: true